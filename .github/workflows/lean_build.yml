name: Build

on:
  # Restricted to `main` so that a branch with a PR open does not build twice,
  # once for the push and once for the pull request. Branches without a PR do
  # not build at all.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform's result, rather than cancelling the others as
      # soon as one fails. Students arrive on all three.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain named in `lean-toolchain`, then runs `lake build`.
      - uses: leanprover/lean-action@v1
        with:
          # Both of these are on by default. They are stated explicitly so the
          # behaviour is visible here and does not drift with the defaults.
          #
          # `lake exe cache get`, without which a run would compile Mathlib from
          # source. The default is `auto`, which infers it from the dependency
          # graph. Saying `true` means a run fails loudly rather than quietly
          # spending hours, should that detection ever stop working.
          use-mathlib-cache: true
          # Reuse of the GitHub Actions cache between runs.
          use-github-cache: true
