name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform's result, rather than cancelling the others as
      # soon as one fails. Students arrive on all three.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain named in `lean-toolchain`, detects the Mathlib
      # dependency and fetches its cache, then runs `lake build`.
      - uses: leanprover/lean-action@v1
